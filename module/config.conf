# 防格机卫士配置（改完点模块「操作」按钮或网页里保存后生效）
# 扫描间隔(毫秒) 50-2000
POLL_MS=250
# 是否击杀命中进程 1=杀 0=只记录
KILL=1
# 拦截后弹窗 1=弹 0=不弹
POPUP=1
# 自动移除新增的设备管理器 1=移除 0=只告警
AUTO_REMOVE_ADMIN=1
# 设备管理器白名单，支持前缀通配 *
ADMIN_WHITELIST=com.android.*,com.google.*,com.vivo.*,com.qualcomm.*,com.mediatek.*,com.dsh.*
# 网页控制台端口（只监听 127.0.0.1）0=关闭
WEB_PORT=8099
# 用户存储保护：/sdcard、/storage/emulated、/data/user 下的删除都拦（只放行 cache/code_cache/.thumbnails/tmp 这类临时目录）
PROTECT_SD=1
# 脚本静态预检：sh 脚本一 exec 就先扫内容，含危险命令行则立刻终止 1=开 0=关
SCAN_SCRIPTS=1
# stdin 预检：`sh < 脚本`、`cat 脚本 | sh` 这类 argv 里没有路径的执行方式 1=开
SCAN_STDIN=1
# 管道来源查不到文件（curl | sh、编码后的载荷）时直接拦；默认 0 只放行不拦
STRICT_PIPE=0

# 块设备可写句柄监控：非系统进程持有 /dev/block 可写句柄即杀 1=开 0=关
# 这是"零落盘防线"的入口，默认开
BLOCK_FD=1
# 块设备句柄扫描间隔(毫秒) 20-1000：独立线程扫，实测 open 到 SIGSTOP 约 50-90ms
BLOCK_FD_MS=100

# 断电保护：命中块设备写入后，冻结进程 -> 刷盘 -> 强制关机
# 1=开 0=关（只杀进程）。这是"用可能丢一点数据换彻底不出事"的取舍，确认能接受再开
POWEROFF=0
# 只冻结不断电（调试用）：1=只冻 0=正常关断
POWEROFF_HOLD=0
# 断电演练：1=走完整流程（冻结+刷盘）但跳过真正的关机命令，用来验证链路 0=正常
POWEROFF_DRYRUN=0
# 开机安全期（秒）：开机这段时间内的块设备写入视为系统正常操作，只杀进程不断电
SAFE_UPTIME=180
