# 防格机卫士 v1.4 配置（控制台改完点「保存并重启守护」）
KILL=1
POPUP=1
AUTO_REMOVE_ADMIN=1
ADMIN_WHITELIST=com.android.*,com.google.*,com.vivo.*,com.qualcomm.*,com.mediatek.*,com.dsh.*
PROTECT_SD=1
SCAN_SCRIPTS=1
SCAN_STDIN=1
STRICT_PIPE=0
# 进程扫描间隔（ms）
POLL_MS=500
# 块设备可写句柄扫描间隔（ms）
BLOCK_FD_MS=400
BLOCK_FD=1
# 控制台端口（busybox httpd，只听 127.0.0.1）0=关闭
WEB_PORT=8099
POWEROFF=0
POWEROFF_HOLD=0
POWEROFF_DRYRUN=0
SAFE_UPTIME=180
