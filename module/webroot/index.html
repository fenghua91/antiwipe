<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>防格机卫士</title>
<style>
:root{--bg:#05070b;--pan:#0a1018;--pan2:#0d141e;--line:rgba(120,200,255,.13);--tx:#e6edf7;--dim:#6b7a90;--dim2:#93a3b8;--cy:#22d3ee;--gr:#34d399;--am:#fbbf24;--rd:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 480px at 50% -8%,#0c1a2b 0%,#05070b 62%) fixed,#05070b;color:var(--tx);font:15px/1.55 -apple-system,'PingFang SC',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(120,200,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,200,255,.05) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 50% 0,#000 0%,transparent 72%)}
.wrap{position:relative;max-width:660px;margin:0 auto;padding:22px 16px 56px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:var(--cy);text-decoration:none}
header{padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.live{width:7px;height:7px;border-radius:50%;background:var(--gr);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
h1{margin:10px 0 2px;font-size:26px;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--dim);font-size:12.5px}
nav{display:flex;gap:2px;margin:0 0 16px;padding:4px;background:var(--pan);border:1px solid var(--line);border-radius:12px}
nav button{flex:1;background:none;border:0;color:var(--dim2);font-size:13.5px;padding:9px 0;border-radius:9px;font-family:inherit}
nav button.on{background:var(--pan2);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.banner{border:1px solid var(--line);background:var(--pan);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.banner.ok{border-color:rgba(52,211,153,.32);background:rgba(52,211,153,.07);color:#8ff0c2}
.banner.bad{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08);color:#fca5a5}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.pill{font-size:11px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim2);background:rgba(10,16,24,.65)}
.pill.on{color:var(--gr);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.pill.off{color:var(--rd);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:26px;line-height:1.25;margin-top:5px;font-weight:600;letter-spacing:-.01em}
.stat .u{font-size:11px;color:var(--dim);margin-left:4px;font-weight:400}
.card{background:linear-gradient(180deg,rgba(13,20,30,.92),rgba(10,16,24,.92));border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.ev{padding:10px 0;border-bottom:1px solid rgba(120,200,255,.08)}
.ev:last-child{border-bottom:0}
.evh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.badge{font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:6px;font-weight:600}
.c{background:rgba(248,113,113,.12);color:#fca5a5;border:1px solid rgba(248,113,113,.32)}
.w{background:rgba(251,191,36,.1);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
.i{background:rgba(167,139,250,.1);color:#c4b5fd;border:1px solid rgba(167,139,250,.3)}
.evd{font-size:14px;margin-top:4px;line-height:1.45;word-break:break-all}
.evc{font-size:11.5px;color:var(--dim);margin-top:3px;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(120,200,255,.08);font-size:14px}
.sw:last-of-type{border-bottom:0}
.sw .d{font-size:11.5px;color:var(--dim);margin-top:2px}
input[type=checkbox]{appearance:none;width:42px;height:24px;border-radius:999px;background:#131b27;border:1px solid var(--line);position:relative;flex:0 0 auto;transition:.18s}
input[type=checkbox]:checked{background:rgba(34,211,238,.22);border-color:rgba(34,211,238,.55)}
input[type=checkbox]:after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#8b98ab;transition:.18s}
input[type=checkbox]:checked:after{left:20px;background:var(--cy);box-shadow:0 0 10px rgba(34,211,238,.75)}
input[type=number],textarea{background:#05080d;color:var(--tx);border:1px solid rgba(120,200,255,.16);border-radius:10px;padding:9px 11px;font:13px ui-monospace,Menlo,monospace;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
.hint{font-size:11.5px;color:var(--dim);margin-top:6px}
button.pri{width:100%;margin-top:14px;background:linear-gradient(180deg,rgba(34,211,238,.22),rgba(34,211,238,.1));border:1px solid rgba(34,211,238,.45);color:#b8f3ff;border-radius:11px;padding:12px;font-size:14px;font-family:inherit}
button.ghost{margin-top:10px;width:100%;background:none;border:1px solid var(--line);color:var(--dim2);border-radius:11px;padding:10px;font-size:13px;font-family:inherit}
.foot{text-align:center;font-size:11px;color:#465468;margin-top:24px;letter-spacing:.08em}
.hide{display:none}
</style></head>
<body><div class="wrap">
<header>
  <div class="brand"><span class="live"></span><span>anti-wipe</span><span class="mono" style="color:#3d4a5c">shell console</span></div>
  <h1>防格机卫士</h1>
  <div class="sub">纯用户态 · 不写任何分区 · busybox CGI 控制台</div>
</header>
<nav>
  <button class="on" data-tab="home">概览</button>
  <button data-tab="events">事件</button>
  <button data-tab="config">配置</button>
</nav>

<section id="tab-home">
  <div id="banner" class="banner">正在读取状态…</div>
  <div class="pills" id="pills"></div>
  <div class="grid" id="stats"></div>
  <div class="card"><h2>最近拦截</h2><div id="recent"><div class="ev"><div class="evd" style="color:#6b7a90">加载中…</div></div></div></div>
</section>

<section id="tab-events" class="hide">
  <div class="pills" style="margin-bottom:8px">
    <span class="pill mono" id="cnt"></span>
    <span class="pill"><a href="#" id="toggleOnly">只看拦截</a></span>
    <span class="pill"><a href="#" id="refresh">刷新</a></span>
  </div>
  <div class="card"><div id="events"></div></div>
</section>

<section id="tab-config" class="hide">
  <div class="card"><h2>拦截策略</h2>
    <div id="switches"></div>
    <div class="row" style="margin-top:12px">
      <div><div class="hint">进程扫描间隔 ms</div><input type="number" id="POLL_MS" min="50" max="2000"></div>
      <div><div class="hint">分区句柄扫描 ms</div><input type="number" id="BLOCK_FD_MS" min="20" max="2000"></div>
    </div>
    <button class="pri" id="saveBtn">保存并重启守护</button>
    <button class="ghost" id="restartBtn">只重启守护</button>
  </div>
  <div class="card"><h2>原始 config.conf</h2><textarea id="raw" rows="12"></textarea></div>
</section>

<div class="foot">ANTI-WIPE · 无二进制 · busybox httpd + CGI</div>
</div>
<script>
var TK = new URLSearchParams(location.search).get('tk') || '';
if (TK) document.cookie = 'tk=' + encodeURIComponent(TK) + '; Path=/; Max-Age=604800';
function fail(msg){ var b=document.getElementById('banner'); if(b){ b.className='banner bad'; b.textContent=msg; } }
function api(p, opt){
  var url = '/cgi-bin/api/' + p + (p.indexOf('?') >= 0 ? '&' : '?') + 'tk=' + encodeURIComponent(TK) + '&_=' + Date.now();
  return fetch(url, opt).then(function(r){ if (r.status === 401) { document.getElementById('banner').className = 'banner bad'; document.getElementById('banner').textContent = '需要令牌：在地址后加 ?tk=你的令牌'; throw 0; } var ct=r.headers.get('content-type')||''; if(ct.indexOf('json')<0) throw new Error('CGI_NOT_EXEC'); return r.json(); }).catch(function(e){ if(e&&e.message==='CGI_NOT_EXEC') fail('后端 CGI 没有执行权限：请在模块「操作」里跑一次 post-fs-data，或重装 v1.4.1'); else if(e) fail('读取失败：'+(e.message||e)); throw e; });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function dur(s){ s = +s || 0; if (s < 60) return s + ' 秒'; if (s < 3600) return Math.floor(s/60) + ' 分 ' + (s%60) + ' 秒'; if (s < 86400) return Math.floor(s/3600) + ' 时 ' + Math.floor(s%3600/60) + ' 分'; return Math.floor(s/86400) + ' 天 ' + Math.floor(s%86400/3600) + ' 时'; }
function evHtml(e){
  var h = '<div class="ev"><div class="evh"><span class="badge ' + e.c + '">' + esc(e.lb) + '</span>';
  if (e.t) h += '<span class="mono">' + esc(e.t) + '</span>';
  if (e.pid) h += '<span class="mono">pid ' + esc(e.pid) + '</span>';
  h += '</div><div class="evd">' + esc(e.d) + '</div>';
  if (e.cmd) h += '<div class="evc">' + esc(e.cmd) + '</div>';
  return h + '</div>';
}
function pill(on, t, f){ return '<span class="pill ' + (on ? 'on' : 'off') + '">' + (on ? t : f) + '</span>'; }
function stat(k, v, u, cls){ return '<div class="stat"><div class="k">' + k + '</div><div class="v ' + cls + ' mono">' + v + '<span class="u">' + u + '</span></div></div>'; }
function loadHome(){
  api('overview.sh').then(function(o){
    var alive = o.main > 0, b = document.getElementById('banner');
    b.className = 'banner ' + (alive ? 'ok' : 'bad');
    b.innerHTML = alive ? '防护运行中 · 主进程 ' + o.main + ' 个，已守 ' + dur(o.uptime) : '<b>防护已停止</b> · 去「配置」页点“只重启守护”';
    document.getElementById('pills').innerHTML =
      pill(o.kill, '命中即杀', '只记录') + pill(o.blockfd, '分区句柄监控', '句柄监控关') +
      pill(o.popup, '拦截弹窗', '不弹窗') + pill(o.rescue, '救援通道守卫', '救援守卫关') +
      pill(!o.poweroff, '断电保护关', '断电保护开(慎用)') +
      '<span class="pill mono">扫描 ' + o.poll + 'ms</span><span class="pill mono">句柄 ' + o.bfdms + 'ms</span>';
    document.getElementById('stats').innerHTML =
      stat('累计拦截', o.total, '次', 'cy') + stat('今天拦截', o.today, '次', o.today > 0 ? 'am' : 'gr') +
      '<div class="stat"><div class="k">已守护</div><div class="v gr" style="font-size:19px">' + dur(o.uptime) + '</div></div>' +
      '<div class="stat"><div class="k">守护进程</div><div class="v mono ' + (alive ? 'gr' : 'rd') + '" style="font-size:20px">' + (o.procs || o.main) + '<span class="u">个</span></div></div>';
  });
  api('events.sh?n=6').then(function(list){
    document.getElementById('recent').innerHTML = list.length ? list.map(evHtml).join('') : '<div class="ev"><div class="evd" style="color:#6b7a90">暂无记录</div></div>';
  });
}
var onlyBlocked = true;
function loadEvents(){
  api('events.sh?n=60').then(function(list){
    var arr = onlyBlocked ? list.filter(function(e){ return e.b; }) : list;
    document.getElementById('cnt').textContent = '显示 ' + arr.length + ' / ' + list.length + ' 条';
    document.getElementById('events').innerHTML = arr.length ? arr.map(evHtml).join('') : '<div class="ev"><div class="evd" style="color:#6b7a90">暂无记录</div></div>';
  });
}
var SW = [
  ['KILL','命中就杀掉','关掉后只记日志，不阻止任何操作'],
  ['POPUP','拦截时弹窗','用系统弹窗告知刚才有东西被拦'],
  ['BLOCK_FD','分区句柄监控','有进程拿到可写分区句柄就动手，最关键的一层'],
  ['SCAN_SCRIPTS','脚本预检','脚本还没执行就先读内容，命中危险行立刻终止'],
  ['PROTECT_SD','保护用户存储','/sdcard、/data/user 下的删除也拦，只放行 cache/tmp'],
  ['RESCUE_GUARD','救援通道守卫','拦 setenforce 0 / 关 USB / 网卡 down'],
  ['BLOCK_REMOUNT','拦重挂系统分区','默认关，很多正常 root 工具也会重挂'],
  ['POWEROFF','命中后强制断电','默认关，可能丢未落盘数据']
];
function loadConfig(){
  api('config.sh').then(function(o){
    var map = {};
    (o.text || '').split('\n').forEach(function(l){ var i = l.indexOf('='); if (i > 0 && l[0] !== '#') map[l.slice(0,i).trim()] = l.slice(i+1).trim(); });
    document.getElementById('switches').innerHTML = SW.map(function(s){
      return '<label class="sw"><span>' + s[1] + '<span class="d">' + s[2] + '</span></span><input type="checkbox" data-key="' + s[0] + '"' + (map[s[0]] === '1' ? ' checked' : '') + '></label>';
    }).join('');
    document.getElementById('POLL_MS').value = map.POLL_MS || 500;
    document.getElementById('BLOCK_FD_MS').value = map.BLOCK_FD_MS || 400;
    document.getElementById('raw').value = o.text || '';
  });
}
function save(){
  var body = [];
  document.querySelectorAll('#switches input[type=checkbox]').forEach(function(c){ body.push(c.dataset.key + '=' + (c.checked ? 1 : 0)); });
  body.push('POLL_MS=' + (document.getElementById('POLL_MS').value || 500));
  body.push('BLOCK_FD_MS=' + (document.getElementById('BLOCK_FD_MS').value || 400));
  var btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = '保存中…';
  api('save.sh', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.join('&')}).then(function(){
    btn.textContent = '已保存，守护重启中'; setTimeout(function(){ btn.disabled = false; btn.textContent = '保存并重启守护'; loadHome(); }, 1800);
  });
}
document.getElementById('saveBtn').onclick = save;
document.getElementById('restartBtn').onclick = function(){ api('restart.sh').then(function(){ setTimeout(loadHome, 1500); }); };
document.getElementById('toggleOnly').onclick = function(e){ e.preventDefault(); onlyBlocked = !onlyBlocked; this.textContent = onlyBlocked ? '只看拦截' : '全部记录'; loadEvents(); };
document.getElementById('refresh').onclick = function(e){ e.preventDefault(); loadEvents(); };
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    ['home','events','config'].forEach(function(t){ document.getElementById('tab-' + t).classList.toggle('hide', t !== b.dataset.tab); });
    if (b.dataset.tab === 'events') loadEvents();
    if (b.dataset.tab === 'config') loadConfig();
  };
});
loadHome();
setInterval(function(){ if (!document.getElementById('tab-home').classList.contains('hide')) loadHome(); }, 15000);
</script>
</body></html>
