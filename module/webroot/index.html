<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>防格机卫士</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(760px 420px at 50% 8%,#0c1a2b 0%,#05070b 62%) fixed,#05070b;
color:#e6edf7;font:15px/1.6 -apple-system,'PingFang SC',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;inset:0;pointer-events:none;
background-image:linear-gradient(rgba(120,200,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,200,255,.05) 1px,transparent 1px);
background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 50% 20%,#000 0%,transparent 72%)}
.wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
gap:16px;padding:26px;box-sizing:border-box;text-align:center}
.shield{width:64px;height:64px;border-radius:20px;border:1px solid rgba(34,211,238,.35);
background:linear-gradient(180deg,rgba(34,211,238,.16),rgba(34,211,238,.03));
display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(34,211,238,.16)}
.shield i{display:block;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
border-bottom:22px solid #22d3ee;filter:drop-shadow(0 0 8px rgba(34,211,238,.8))}
.brand{font-size:11px;letter-spacing:.24em;color:#6b7a90;text-transform:uppercase}
h1{margin:0;font-size:22px;letter-spacing:-.01em;font-weight:650}
.hint{color:#6b7a90;font-size:12.5px;max-width:330px;min-height:2.6em}
.spin{width:22px;height:22px;border:2px solid rgba(120,200,255,.16);border-top-color:#22d3ee;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
a.btn{display:inline-block;background:linear-gradient(180deg,rgba(34,211,238,.24),rgba(34,211,238,.1));
border:1px solid rgba(34,211,238,.45);color:#b8f3ff;border-radius:11px;padding:11px 20px;
text-decoration:none;font-size:14px;letter-spacing:.02em}
.foot{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:10.5px;color:#3d4a5c;letter-spacing:.14em}
</style></head>
<body><div class="wrap">
<div class="shield"><i></i></div>
<div class="brand">anti-wipe</div>
<h1>防格机卫士</h1>
<div class="spin" id="s"></div>
<div class="hint" id="h">正在连接本机控制台（127.0.0.1）…</div>
<a class="btn" id="b" href="http://127.0.0.1:8099/">打开控制台</a>
</div>
<div class="foot">用户态防护 · 不写任何分区</div>
<script src="token.js"></script>
<script>
(function(){
  var tk = String(window.ANTIWIPE_TK || "").trim();
  var base = "http://127.0.0.1:8099/";
  var url = base + (tk ? "?tk=" + encodeURIComponent(tk) : "");
  document.getElementById("b").href = url;
  setTimeout(function(){ location.replace(url); }, 150);
  setTimeout(function(){
    var s = document.getElementById("s");
    if (s) s.style.display = "none";
    document.getElementById("h").textContent = "没自动跳过去？点下面的按钮手动打开。";
  }, 2500);
})();
</script>
</body></html>
